name: CI/CD for Next.js with DigitalOcean VPS

on:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy Production'
        required: true
        type: boolean
  push:
    branches:
      - main
  pull_request:

jobs:
  # --- Build ---------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22   # ✅ Use Node.js 22
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Installing dependencies
        run: pnpm install
      - name: Building Project
        run: pnpm build

  # --- Deploy to DigitalOcean VPS ---------------
  deploy:
    if: |
      github.event_name != 'pull_request' &&
      (
        github.ref_name == 'main' ||
        startsWith(github.ref, 'refs/tags/')
      )
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to DigitalOcean VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          PROJECT_DIR: "/home/www/goumrah-konvensional"
        run: |
          # Setup SSH Key
          echo "$SSH_PRIVATE_KEY" > private_key && chmod 600 private_key

          # Connect to VPS and deploy
          ssh -o StrictHostKeyChecking=no -i private_key $VPS_USER@$VPS_HOST << 'EOF'
            set -e
          
            echo "🚀 Connecting to VPS and deploying Next.js app..."

            # Ensure project directory exists
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "❌ Project directory not found: $PROJECT_DIR"
              exit 1
            fi

            cd $PROJECT_DIR

            # Pull latest changes from GitHub
            echo "📥 Pulling latest code from GitHub..."
            sudo -u www-data git pull origin main || { echo "❌ Git pull failed"; exit 1; }

            # Ensure pnpm is installed
            echo "🔄 Ensuring pnpm is installed..."
            if ! command -v pnpm &> /dev/null; then
              echo "⚠️ pnpm not found, installing..."
              sudo -u www-data npm install -g pnpm
            fi

            # Install dependencies
            echo "📦 Installing dependencies..."
            sudo -u www-data pnpm install --frozen-lockfile || { echo "❌ Dependency installation failed"; exit 1; }

            # Build the project using Node.js 22
            echo "🔨 Building the project..."
            sudo -u www-data pnpm run build || { echo "❌ Build failed"; exit 1; }

            # Restart the application using PM2
            echo "🔄 Restarting application with PM2..."
            sudo -u www-data pm2 startOrRestart ecosystem.config.js || { echo "❌ PM2 restart failed"; exit 1; }

            # Save PM2 process
            sudo -u www-data pm2 save || { echo "❌ PM2 save failed"; exit 1; }

            echo "✅ Deployment completed successfully!"
          EOF

          # Cleanup private key
          rm -f private_key
