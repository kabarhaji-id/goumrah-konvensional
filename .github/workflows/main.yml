name: CI/CD for Next.js with DigitalOcean VPS

on:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy to Production'
        required: true
        type: boolean
  push:
    branches:
      - main
  pull_request:

jobs:
  # --- Build Job ---------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22  # ✅ Use Node.js 22
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Installing dependencies
        run: pnpm install
      - name: Building Project
        run: pnpm build

  # --- Deploy to DigitalOcean VPS ---------------
  deploy:
    if: |
      github.event_name != 'pull_request' &&
      (
        github.ref_name == 'main' ||
        startsWith(github.ref, 'refs/tags/')
      )
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to DigitalOcean VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          PROJECT_DIR: ${{ secrets.PROJECT_DIR }}
        run: |
          # ✅ Debugging output (visible in GitHub Actions logs)
          echo "🚀 Starting Deployment..."
          echo "🔧 SSH Host: $VPS_HOST"
          echo "🔧 SSH User: $VPS_USER"
          echo "🔧 SSH Port: $VPS_PORT"
          echo "📂 Project Directory: $PROJECT_DIR"

          # 🚨 Validate required secrets
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_PORT" ] || [ -z "$PROJECT_DIR" ]; then
            echo "❌ ERROR: One or more required secrets are missing!"
            exit 1
          fi

          # 🔑 Setup SSH Key
          echo "$SSH_PRIVATE_KEY" > private_key && chmod 600 private_key

          # 🔌 Connect to VPS and deploy
          ssh -o StrictHostKeyChecking=no -i private_key -p $VPS_PORT $VPS_USER@$VPS_HOST << 'EOF'
            set -e

            echo "🚀 Connected to VPS on port $VPS_PORT"
            echo "📂 Checking project directory: $PROJECT_DIR"

            # ✅ Ensure project directory exists
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "⚠️ Project directory not found. Creating it..."
              sudo mkdir -p "$PROJECT_DIR" || { echo "❌ Failed to create project directory"; exit 1; }
              sudo chown -R www-data:www-data "$PROJECT_DIR"
            fi

            # 🔄 Navigate to project directory
            cd "$PROJECT_DIR"

            # 📥 Pull latest changes from GitHub
            echo "📥 Pulling latest code..."
            sudo -u www-data git pull origin main || { echo "❌ Git pull failed"; exit 1; }

            # 🔄 Ensure pnpm is installed
            echo "🔄 Checking if pnpm is installed..."
            if ! command -v pnpm &> /dev/null; then
              echo "⚠️ pnpm not found, installing..."
              sudo -u www-data npm install -g pnpm
            fi

            # 📦 Install dependencies
            echo "📦 Installing dependencies..."
            sudo -u www-data pnpm install --frozen-lockfile || { echo "❌ Dependency installation failed"; exit 1; }

            # 🔨 Build the project
            echo "🔨 Building the project..."
            sudo -u www-data pnpm run build || { echo "❌ Build failed"; exit 1; }

            # 🚀 Restart the application using PM2
            echo "🔄 Restarting application with PM2..."
            sudo -u www-data pm2 startOrRestart ecosystem.config.js || { echo "❌ PM2 restart failed"; exit 1; }

            # 💾 Save PM2 process
            sudo -u www-data pm2 save || { echo "❌ PM2 save failed"; exit 1; }

            echo "✅ Deployment successful!"
          EOF

          # 🗑️ Cleanup private key
          rm -f private_key
