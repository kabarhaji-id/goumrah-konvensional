name: CI/CD for Next.js with VPS

on:
  push:
    branches:
      - main  # Run deployment on pushes to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Step 3: Install pnpm
      - name: Install pnpm
        run: npm install -g pnpm

      # Step 4: Install dependencies
      - name: Install dependencies
        run: pnpm install

      # Step 5: Build the Next.js application
      - name: Build GoUmrah app
        run: sudo -u www-data pnpm run build

      # Step 6: Transfer files and PM2 config to VPS
      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}             # Set this in GitHub Secrets
          username: ${{ secrets.VPS_USER }}         # Set this in GitHub Secrets
          key: ${{ secrets.SSH_PRIVATE_KEY }}       # Set this in GitHub Secrets
          port: ${{ secrets.VPS_PORT }}      # Change if your VPS uses a different SSH port
          source: |
            .next/**                                # Path to build output
            ecosystem.config.js                     # PM2 config
          target: "/home/www/goumrah-konvensional"  # Target directory on VPS

      # Step 7: Restart the application using PM2
      - name: Restart application with PM2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/www/goumrah-konvensional
            sudo -u www-data pnpm install --prod                  # Ensure production dependencies are installed
            sudo -u www-data pm2 startOrRestart ecosystem.config.js
